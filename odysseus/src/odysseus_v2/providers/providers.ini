# Vendor defaults, one section per provider (the section name is the
# provider's PROVIDER_NAME).
#
#   base_url     API root, without a trailing slash
#   model        default model id; leave empty to force an explicit choice
#   api_key_env  environment variables holding the key, comma-separated,
#                checked in order
#
# To change any of these without editing this file, point ODYSSEUS_CONFIG
# at your own .ini file: its values override the ones here, key by key.
# Environment variables (ODYSSEUS_MODEL, ODYSSEUS_BASE_URL) and keyword
# overrides passed to create_provider() still take precedence over both.

[gemini]
base_url = https://generativelanguage.googleapis.com/v1beta
model = gemini-3.1-pro-preview
api_key_env = GEMINI_API_KEY, GOOGLE_API_KEY

[openai]
base_url = https://api.openai.com/v1
model =
api_key_env = OPENAI_API_KEY

[openrouter]
base_url = https://openrouter.ai/api/v1
model = google/gemini-3.1-pro-preview
api_key_env = OPENROUTER_API_KEY

[anthropic]
base_url = https://api.anthropic.com/v1
model = claude-sonnet-5-5
api_key_env = ANTHROPIC_API_KEY
