[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus-v2"
description = "The smallest agentic harness, vendor-agnostic (Gemini, OpenAI, OpenRouter, Anthropic)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kiran Kumar Saravana" }]
dependencies = []            # standard library only
dynamic = ["version"]

[tool.setuptools]
packages = ["odysseus_v2", "odysseus_v2.providers"]

[tool.setuptools.dynamic]
version = { attr = "odysseus_v2.__version__" }

[tool.setuptools.package-data]
# Vendor defaults are read at runtime, so they must ship with the package.
"odysseus_v2.providers" = ["providers.ini"]
